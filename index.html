              <Input label="Exam Name" required value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} />
              <Select label="Class" required value={formData.classId} onChange={(e) => setFormData({ ...formData, classId: e.target.value, subjectId: '' })} options={classes.map(c => ({ value: c.id, label: c.name }))} />
              <Select label="Subject" required value={formData.subjectId} onChange={(e) => setFormData({ ...formData, subjectId: e.target.value })} options={classSubjects.map(s => ({ value: s.id, label: s.name }))} />
              <Input label="Date" type="date" required value={formData.date} onChange={(e) => setFormData({ ...formData, date: e.target.value })} />
              <div className="flex gap-4">
                <Input label="Start Time" type="time" required value={formData.startTime} onChange={(e) => setFormData({ ...formData, startTime: e.target.value })} className="flex-1" />
                <Input label="End Time" type="time" required value={formData.endTime} onChange={(e) => setFormData({ ...formData, endTime: e.target.value })} className="flex-1" />
              </div>
              <Input label="Max Marks" type="number" required value={formData.maxMarks} onChange={(e) => setFormData({ ...formData, maxMarks: parseInt(e.target.value, 10) || 0 })} />
              <div className="pt-4 flex gap-3">
                <Button type="button" variant="ghost" className="flex-1" onClick={() => setIsModalOpen(false)}>Cancel</Button>
                <Button type="submit" className="flex-1">Save Exam</Button>
              </div>
            </form>
          </Modal>
        </div>
      );
    };

    const TeacherEnterMarks = () => {
      const { data: { classes, appUsers, exams, subjects }, functions: { updateRecord }, showToast } = useContext(AppDataContext);
      const [selectedClassId, setSelectedClassId] = useState('');
      const [selectedExamId, setSelectedExamId] = useState('');
      const [marksState, setMarksState] = useState({});

      const classExams = exams.filter(e => e.classId === selectedClassId);
      const activeExam = exams.find(e => e.id === selectedExamId);
      const studentsInClass = appUsers.filter(u => u.role === 'student' && u.classId === selectedClassId);

      useEffect(() => { setMarksState(activeExam?.records || {}); }, [activeExam]);

      const handleSubmit = async () => {
        if (!activeExam) return;
        const cleanRecords = {};
        Object.entries(marksState).forEach(([sid, mark]) => { if (mark !== '' && !isNaN(mark)) cleanRecords[sid] = mark; });
        await updateRecord('exams', activeExam.id, { records: cleanRecords });
        showToast('Marks saved successfully', 'success');
      };

      return (
        <div className="space-y-6">

                      <td className="py-3 px-4">{st.name}</td>
                      <td className="py-3 px-4"><input type="number" max={activeExam.maxMarks} min={0} value={marksState[st.id] ?? ''} onChange={(e) => setMarksState(prev => ({ ...prev, [st.id]: e.target.value === '' ? '' : Math.min(activeExam.maxMarks, Math.max(0, parseInt(e.target.value, 10))) }))} className="w-full px-3 py-1.5 rounded-lg border dark:bg-slate-800 dark:border-slate-600" /></td>
                    </tr>
                  ))}

              </table>
            </Card>
          )}
        </div>
      );

                </div>
                <Input label="Phone" value={formData.phone} onChange={(e) => setFormData({ ...formData, phone: e.target.value })} />
                <Select label="Blood Group" value={formData.bloodGroup} onChange={(e) => setFormData({ ...formData, bloodGroup: e.target.value })} options={['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'].map(b => ({ value: b, label: b }))} />
                <Input label="Home Address" value={formData.address} onChange={(e) => setFormData({ ...formData, address: e.target.value })} />
                <div className="flex gap-3 pt-2"><Button type="button" variant="ghost" onClick={() => setIsEditing(false)}>Cancel</Button><Button type="submit">Save</Button></div>
              </form>
            </Card>
          ) : (
            <div className="flex justify-center py-4">
              <IDCardRenderer user={currentUser} studentClass={studentClass} collegeName={gs.collegeName || 'Manage College'} collegeAddress={gs.collegeAddress || ''} collegeDetailedAddress={gs.collegeDetailedAddress || ''} collegePhoto={gs.collegePhoto || ''} />
            </div>
          )}
        </div>
      );
    };

    const AdminBulkIDCards = () => {
      const { data: { appUsers, classes, settings } } = useContext(AppDataContext);
      const gs = settings?.find(s => s.type === 'general') || {};
      const [roleTab, setRoleTab] = useState('student');
      const targetUsers = appUsers.filter(u => u.role === roleTab);
      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center print:hidden">
            <div><h2 className="text-2xl font-bold">Bulk ID Cards</h2><p className="text-slate-500">Print ID cards for all students and teachers.</p></div>
            <Button onClick={() => window.print()} icon={<Download size={18} />}>Print All</Button>
          </div>
          <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl w-full max-w-sm print:hidden">
            <button onClick={() => setRoleTab('student')} className={`flex-1 py-2 text-sm font-medium rounded-lg ${roleTab === 'student' ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600' : 'text-slate-500'}`}>Students</button>
            <button onClick={() => setRoleTab('teacher')} className={`flex-1 py-2 text-sm font-medium rounded-lg ${roleTab === 'teacher' ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600' : 'text-slate-500'}`}>Teachers</button>
          </div>
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-8">
            {targetUsers.map(u => (
              <div key={u.id} className="flex justify-center">
                <IDCardRenderer user={u} studentClass={classes.find(c => c.id === u.classId)} collegeName={gs.collegeName || 'Manage College'} collegeAddress={gs.collegeAddress || ''} collegeDetailedAddress={gs.collegeDetailedAddress || ''} collegePhoto={gs.collegePhoto || ''} />
              </div>
            ))}
          </div>
        </div>
      );
    };

    const AdminSettings = () => {
      const { data: { settings, appUsers }, functions: { addRecord, updateRecord, resetDemoData }, showToast, requestConfirm } = useContext(AppDataContext);
      const gs = settings?.find(s => s.type === 'general') || {};
      const adminUser = appUsers?.find(u => u.role === 'admin');

      const [collegeName, setCollegeName] = useState(gs.collegeName || 'Manage College');
      const [collegeAddress, setCollegeAddress] = useState(gs.collegeAddress || '');
      const [collegeDetailedAddress, setCollegeDetailedAddress] = useState(gs.collegeDetailedAddress || '');
      const [collegePhoto, setCollegePhoto] = useState(gs.collegePhoto || '');

      // Admin Credentials State
      const [adminIdStr, setAdminIdStr] = useState(adminUser?.idStr || 'admin');
      const [adminPassword, setAdminPassword] = useState(adminUser?.password || 'password');
      const [confirmPassword, setConfirmPassword] = useState(adminUser?.password || 'password');
      const [showAdminPass, setShowAdminPass] = useState(false);

      useEffect(() => {
        if (adminUser) {
          setAdminIdStr(adminUser.idStr || 'admin');
          setAdminPassword(adminUser.password || 'password');
          setConfirmPassword(adminUser.password || 'password');
        }
      }, [adminUser?.id, adminUser?.idStr, adminUser?.password]);

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 1024 * 1024) return showToast('Image size should be less than 1MB', 'error');
        const reader = new FileReader();
        reader.onloadend = () => setCollegePhoto(reader.result);
        reader.readAsDataURL(file);
      };

      const handleUpdateAdminCredentials = async (e) => {
        e.preventDefault();
        if (!adminUser) return showToast('Admin account not found', 'error');
        const trimmedId = adminIdStr.trim();
        if (!trimmedId) return showToast('Admin ID cannot be empty', 'error');
        if (!adminPassword) return showToast('Password cannot be empty', 'error');
        if (adminPassword !== confirmPassword) return showToast('Passwords do not match', 'error');

        const duplicate = appUsers.some(u => u.id !== adminUser.id && u.idStr === trimmedId);
        if (duplicate) return showToast('This ID is already used by another user', 'error');

        await updateRecord('appUsers', adminUser.id, { idStr: trimmedId, password: adminPassword });
        showToast('Admin ID & Password updated successfully', 'success');
      };

      return (
        <div className="space-y-6">
          <div><h2 className="text-2xl font-bold">System Settings</h2><p className="text-slate-500">Manage global college settings, admin credentials & browser data.</p></div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
            <Card className="space-y-6">
              <h3 className="text-lg font-bold border-b border-slate-100 dark:border-slate-700 pb-3">College Details</h3>
              <form onSubmit={async (e) => {
                e.preventDefault();
                const payload = { collegeName, collegeAddress, collegeDetailedAddress, collegePhoto, type: 'general' };
                if (gs.id) await updateRecord('settings', gs.id, payload);
                else await addRecord('settings', payload);
                showToast('Settings saved successfully', 'success');
              }} className="space-y-4">
                <Input label="College Name" required value={collegeName} onChange={(e) => setCollegeName(e.target.value)} />
                <Input label="College Short Address" value={collegeAddress} onChange={(e) => setCollegeAddress(e.target.value)} />
                <div className="flex flex-col gap-1.5">
                  <label className="text-sm font-semibold text-slate-700 dark:text-slate-300">College Detailed Address (ID Back)</label>
                  <textarea rows="3" value={collegeDetailedAddress} onChange={(e) => setCollegeDetailedAddress(e.target.value)} className="px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 outline-none resize-none" />
                </div>
                <div className="flex items-center gap-4">
                  <div className="w-16 h-16 rounded-xl bg-slate-100 dark:bg-slate-700 overflow-hidden flex items-center justify-center">{collegePhoto ? <img src={collegePhoto} className="w-full h-full object-cover" /> : <Library size={24} className="text-slate-400" />}</div>
                  <label className="cursor-pointer bg-slate-100 dark:bg-slate-700 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2"><Upload size={16} /> Campus Photo<input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} /></label>
                </div>
                <Button type="submit" className="w-full">Save Settings</Button>
              </form>
              <div className="pt-4 border-t border-slate-200 dark:border-slate-700">
                <Button
                  variant="danger"
                  className="w-full"
                  onClick={() => requestConfirm({
                    title: 'Reset All Data',
                    message: 'This will clear saved browser data and restore the default demo records. Continue?',
                    confirmLabel: 'Reset Data',
                    onConfirm: () => { resetDemoData(); showToast('Demo data restored', 'success'); }
                  })}
                >
                  Reset Local Demo Data
                </Button>
              </div>
            </Card>

            <Card className="space-y-5">
              <h3 className="text-lg font-bold border-b border-slate-100 dark:border-slate-700 pb-3">Admin Account Security</h3>
              <p className="text-sm text-slate-500">Change the Admin login ID and password used to access the admin dashboard.</p>
              <form onSubmit={handleUpdateAdminCredentials} className="space-y-4">
                <Input
                  label="Admin ID"
                  required
                  value={adminIdStr}
                  onChange={(e) => setAdminIdStr(e.target.value)}
                  placeholder="admin"
                />
                <Input
                  label="New Password"
                  type={showAdminPass ? 'text' : 'password'}
                  required
                  value={adminPassword}
                  onChange={(e) => setAdminPassword(e.target.value)}
                  placeholder="Enter new password"
                />
                <Input
                  label="Confirm Password"
                  type={showAdminPass ? 'text' : 'password'}
                  required
                  value={confirmPassword}
                  onChange={(e) => setConfirmPassword(e.target.value)}
                  placeholder="Re-enter new password"
                />
                <label className="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400 cursor-pointer select-none">
                  <input
                    type="checkbox"
                    checked={showAdminPass}
                    onChange={(e) => setShowAdminPass(e.target.checked)}
                    className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                  />
                  Show password
                </label>
                <Button type="submit" className="w-full">Update Admin Credentials</Button>
              </form>
            </Card>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 9. NAVIGATION GROUP WRAPPERS
    // =========================================================================
    const TabBar = ({ tabs, activeTab, setActiveTab }) => (
      <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl w-full max-w-md mb-6 print:hidden">
        {tabs.map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${activeTab === t.id ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-400' : 'text-slate-500'}`}>{t.label}</button>
        ))}
      </div>
    );

    const AdminAcademics = () => {
      const [tab, setTab] = useState('classes');
      return <div><TabBar tabs={[{ id: 'classes', label: 'Classes' }, { id: 'subjects', label: 'Subjects' }, { id: 'timetable', label: 'Timetable' }]} activeTab={tab} setActiveTab={setTab} />{tab === 'classes' && <AdminManageClasses />}{tab === 'subjects' && <AdminManageSubjects />}{tab === 'timetable' && <AdminTimetable />}</div>;
    };
    const AdminAttendanceGroup = () => {
      const [tab, setTab] = useState('edit');
      return <div><TabBar tabs={[{ id: 'edit', label: 'Manage' }, { id: 'reports', label: 'Reports' }]} activeTab={tab} setActiveTab={setTab} />{tab === 'edit' && <AdminEditAttendance />}{tab === 'reports' && <ReportsView />}</div>;
    };
    const AdminExamsGroup = () => {
      const [tab, setTab] = useState('manage');
      return <div><TabBar tabs={[{ id: 'manage', label: 'Manage' }, { id: 'reports', label: 'Reports' }]} activeTab={tab} setActiveTab={setTab} />{tab === 'manage' && <AdminManageExams />}{tab === 'reports' && <ExamReportsView />}</div>;
    };
    const AdminSettingsGroup = () => {
      const [tab, setTab] = useState('settings');
      return <div><TabBar tabs={[{ id: 'settings', label: 'Settings' }, { id: 'bulk-id', label: 'Bulk ID Cards' }]} activeTab={tab} setActiveTab={setTab} />{tab === 'settings' && <AdminSettings />}{tab === 'bulk-id' && <AdminBulkIDCards />}</div>;
    };
    const TeacherAttendanceGroup = ({ user }) => {
      const [tab, setTab] = useState('take');
      return <div><TabBar tabs={[{ id: 'take', label: 'Take Attendance' }, { id: 'reports', label: 'Reports' }]} activeTab={tab} setActiveTab={setTab} />{tab === 'take' && <TeacherTakeAttendance user={user} />}{tab === 'reports' && <ReportsView />}</div>;
    };
    const TeacherExamsGroup = ({ user }) => {
      const [tab, setTab] = useState('enter');
      return <div><TabBar tabs={[{ id: 'enter', label: 'Enter Marks' }, { id: 'reports', label: 'Reports' }]} activeTab={tab} setActiveTab={setTab} />{tab === 'enter' && <TeacherEnterMarks user={user} />}{tab === 'reports' && <ExamReportsView />}</div>;
    };
    const StudentReportsGroup = ({ user }) => {
      const [tab, setTab] = useState('attendance');
      return <div><TabBar tabs={[{ id: 'attendance', label: 'My Attendance' }, { id: 'exams', label: 'My Exams' }]} activeTab={tab} setActiveTab={setTab} />{tab === 'attendance' && <StudentAttendanceReport user={user} />}{tab === 'exams' && <StudentExamReport user={user} />}</div>;
    };

    // =========================================================================
    // 10. MAIN APPLICATION
    // =========================================================================
    function App() {
      const [isDark, setIsDark] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', confirmLabel: 'Confirm', onConfirm: () => {} });
      const [loggedInAppUser, setLoggedInAppUser] = useState(null);
      const [dbState, setDbState] = useState(loadInitialDB);

      // Persist all changes automatically to localStorage
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(dbState));
        } catch (err) {
          console.error('Failed to persist data:', err);
        }
      }, [dbState]);

      const showToast = (message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      const requestConfirm = ({ title, message, confirmLabel = 'Delete', onConfirm }) => {
        setConfirmDialog({ isOpen: true, title, message, confirmLabel, onConfirm });
      };

      const toggleTheme = () => {
        setIsDark(prev => {
          const next = !prev;
          document.documentElement.classList.toggle('dark', next);
          return next;
        });
      };

      const addRecord = async (colName, data) => {
        const newItem = { id: `${colName}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, ...data };
        setDbState(prev => ({ ...prev, [colName]: [...(prev[colName] || []), newItem] }));
      };

      const updateRecord = async (colName, id, data) => {
        setDbState(prev => ({
          ...prev,
          [colName]: (prev[colName] || []).map(item => (item.id === id ? { ...item, ...data } : item))
        }));
      };

      const deleteRecord = async (colName, id) => {
        setDbState(prev => ({
          ...prev,
          [colName]: (prev[colName] || []).filter(item => item.id !== id)
        }));
      };

      const resetDemoData = () => {
        const fresh = getDefaultSeedData();
        setDbState(fresh);
      };

      const appDataContextValue = useMemo(() => ({
        data: dbState,
        functions: { addRecord, updateRecord, deleteRecord, resetDemoData },
        showToast,
        requestConfirm
      }), [dbState]);

      const getNavigation = (role) => {
        if (role === 'admin') return [
          { id: 'users', label: 'Members', icon: <Users size={20} />, component: AdminManageUsers },
          { id: 'academics', label: 'Academics', icon: <BookOpen size={20} />, component: AdminAcademics },
          { id: 'attendance', label: 'Attendance', icon: <CheckSquare size={20} />, component: AdminAttendanceGroup },
          { id: 'exams', label: 'Exams', icon: <FileText size={20} />, component: AdminExamsGroup },
          { id: 'settings', label: 'Settings', icon: <Settings size={20} />, component: AdminSettingsGroup }
        ];
        if (role === 'teacher') return [
          { id: 'attendance', label: 'Attendance', icon: <CheckSquare size={20} />, component: TeacherAttendanceGroup },
          { id: 'exams', label: 'Exams', icon: <FileText size={20} />, component: TeacherExamsGroup },
          { id: 'id-card', label: 'My ID Card', icon: <CreditCard size={20} />, component: UserIDCard }
        ];
        if (role === 'student') return [
          { id: 'dashboard', label: 'Dashboard', icon: <LayoutDashboard size={20} />, component: StudentDashboard },
          { id: 'reports', label: 'My Reports', icon: <Database size={20} />, component: StudentReportsGroup },
          { id: 'id-card', label: 'ID Card', icon: <CreditCard size={20} />, component: UserIDCard }
        ];
        return [];
      };

      return (
        <ErrorBoundary>
          <ThemeContext.Provider value={{ isDark, toggleTheme }}>
            <ToastContext.Provider value={{ showToast }}>
              <AppDataContext.Provider value={appDataContextValue}>
                <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none print:hidden">
                  {toasts.map(t => (
                    <div key={t.id} className={`flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-sm font-semibold ${t.type === 'error' ? 'bg-red-500 text-white' : t.type === 'success' ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-white'}`}>
                      {t.type === 'error' ? <AlertCircle size={16} /> : <CheckCircle2 size={16} />}
                      {t.message}
                    </div>
                  ))}
                </div>
                <ConfirmModal
                  isOpen={confirmDialog.isOpen}
                  onClose={() => setConfirmDialog(prev => ({ ...prev, isOpen: false }))}
                  onConfirm={confirmDialog.onConfirm}
                  title={confirmDialog.title}
                  message={confirmDialog.message}
                  confirmLabel={confirmDialog.confirmLabel}
                />
                {!loggedInAppUser ? (
                  <LoginScreen onLogin={(user) => { setLoggedInAppUser(user); showToast(`Welcome, ${user.name.split(' ')[0]}`, 'success'); }} />
                ) : (
                  <Layout
                    user={dbState.appUsers.find(u => u.id === loggedInAppUser.id) || loggedInAppUser}
                    onLogout={() => setLoggedInAppUser(null)}
                    navigation={getNavigation(loggedInAppUser.role)}
                  />
                )}
              </AppDataContext.Provider>
            </ToastContext.Provider>
          </ThemeContext.Provider>
        </ErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
